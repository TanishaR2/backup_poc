    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "pymupdf4llm>=1.27.2.3",
    "flagembedding>=1.4.0",
    "optimum>=2.2.0",
    "gptqmodel>=7.1.0",
    "google-genai>=2.9.0",
    "pandas>=3.0.3",
