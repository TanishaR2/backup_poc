    "google-auth-httplib2>=0.4.0",
    "google-auth-oauthlib>=1.4.0",
    "tqdm>=4.68.3",
    "cohere>=7.0.5",
    "fastapi>=0.139.0",
    "rouge-score>=0.1.2",
    "uvicorn>=0.51.0",
    "azure-storage-blob>=12.30.0",
    "streamlit>=1.59.1",
    "streamlit-option-menu>=0.4.0",
    "requests>=2.34.2",
    "python-dateutil>=2.9.0.post0",
